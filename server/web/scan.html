<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lector de puerta — Sistema Moteles</title>
<link rel="stylesheet" href="/style.css">
<style>
  [hidden]{display:none!important}
  .scan-card{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 14px}
  .scan-cta{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0 2px}
  .scan-wait{font-size:13px;letter-spacing:.16em;font-weight:800;color:#86efac;
    text-transform:uppercase;text-align:center}
  .scan-big{width:min(72vw,260px);aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;
    background:radial-gradient(circle at 34% 28%,#4ade80 0%,#22c55e 42%,#15803d 100%);
    color:#06280f;box-shadow:0 16px 34px #16a34a66,inset 0 -7px 18px #14532d80;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    font-family:inherit;animation:scanBounce 2.6s ease-in-out infinite;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .scan-big:active{filter:brightness(.94)}
  .scan-big:focus-visible{outline:3px solid #bbf7d0;outline-offset:5px}
  .scan-big:disabled{opacity:.55;cursor:default}
  .scan-big.occupied{background:radial-gradient(circle at 34% 28%,#2dd4bf 0%,#0f766e 42%,#134e4a 100%);
    color:#ecfeff;box-shadow:0 16px 34px #0f766e66,inset 0 -7px 18px #042f2e80}
  .scan-wait.occupied{color:#99f6e4}
  .scan-big-icon{font-size:42px;line-height:1}
  .scan-big-text{font-size:19px;font-weight:900;line-height:1.1;letter-spacing:.02em}
  .scan-big-sub{font-size:12px;font-weight:700;opacity:.8;margin-top:2px}
  @keyframes scanBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
  @media (prefers-reduced-motion:reduce){.scan-big{animation:none}}
  #video{display:none;max-height:62vh;object-fit:cover}
  #video.on{display:block}
  .scan-actions{display:none;gap:8px;flex-wrap:wrap;justify-content:center}
  .scan-actions.on{display:flex}
  .manual-box{width:100%;margin-top:4px;border-top:1px solid #263042;padding-top:10px}
  .manual-box summary{cursor:pointer;color:#93a0b4;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>📷 Lector de puerta</h1>
  <span class="chip" id="cabname">cabina –</span>
</header>
<main>
  <div class="card" id="err" hidden></div>

  <div class="card scan-card">
    <div class="scan-cta" id="cta">
      <div class="scan-wait" id="cta-wait">CABAÑA · ESPERANDO PASAJEROS</div>
      <button class="scan-big" id="start" aria-label="Activar cámara para escanear el código">
        <span class="scan-big-icon">📷</span>
        <span class="scan-big-text">TOCA<br>PARA ESCANEAR</span>
        <span class="scan-big-sub">Presenta tu código QR</span>
      </button>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <div class="scan-actions" id="actions">
      <button class="btn" id="torch" hidden>💡 Luz encendida</button>
      <button class="btn" id="stop">⏹️ Apagar cámara</button>
    </div>
    <p class="mut small" id="hint" style="margin:0;text-align:center">
      Toca el botón verde para encender la cámara.</p>

    <details class="manual-box">
      <summary>¿Problemas? Ingresar código manual</summary>
      <div class="row" style="margin-top:10px">
        <input type="text" id="manual" placeholder="MTL1-xxxxxxxx o código de 6 letras"
               style="flex:1" autocomplete="off">
        <button class="btn ok bigbtn" id="send">Validar</button>
      </div>
    </details>
    <input type="file" id="photo" accept="image/*" capture="environment" hidden>
  </div>
</main>

<div id="overlay" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="/vendor/jsQR.js"></script>
<script>
const P = new URLSearchParams(location.search);
const CAB = +(P.get('cab') || 0);
const K = P.get('k') || '';
let video, canvas, ctx, cooldown = false, lastCode = null, lastTs = 0;
let camOn = false, lastDecode = 0, stream = null, track = null;

function fatal(msg, disable) {
  const e = document.getElementById('err');
  e.hidden = false;
  e.innerHTML = '<b>Cámara no disponible.</b><br>' + msg;
  if (disable) document.getElementById('start').disabled = true;
  if (!/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
    document.getElementById('manual').focus();
  }
}
if (!CAB) fatal('Falta <code>?cab=N</code> en la URL.', true);
const SECURE = window.isSecureContext && !!navigator.mediaDevices;
document.getElementById('cabname').textContent = CAB ? 'Cabaña ' + CAB : 'Cabaña –';
document.getElementById('cta-wait').textContent =
  CAB ? 'CABAÑA ' + CAB + ' · ESPERANDO PASAJEROS' : 'CABAÑA · ESPERANDO PASAJEROS';
if (!SECURE) {
  document.getElementById('cta-wait').textContent = 'MODO FOTO · SIN HTTPS';
  document.querySelector('#start .scan-big-icon').textContent = '🖼️';
  document.querySelector('#start .scan-big-text').innerHTML = 'TOMAR<br>FOTO';
  document.querySelector('#start .scan-big-sub').textContent = 'del código QR';
  document.getElementById('hint').innerHTML =
    'Sin HTTPS no hay cámara en vivo. Toca el botón para tomar una foto del QR.';
}

function beep(okFreq) {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.value = okFreq ? 880 : 220;
    g.gain.value = 0.3;
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + 0.4);
  } catch (e) {}
}

function showResult(res) {
  const ov = document.getElementById('overlay');
  if (res.ok && res.staff) {
    ov.className = 'ok';
    ov.innerHTML = `<div style="font-size:34px">✅ ACCESO PERSONAL</div>
      <div style="font-size:24px">${res.staff.name}</div>
      <div style="font-size:16px">${res.staff.role || ''} · ${res.cabin}</div>
      <div class="small" style="opacity:.75">${(res.unlock && res.unlock.detail) || ''}</div>`;
    beep(true);
    if (navigator.vibrate) navigator.vibrate([80, 60, 80]);
  } else if (res.ok) {
    ov.className = 'ok';
    ov.innerHTML = `<div style="font-size:36px">✅ ACCESO PERMITIDO</div>
      <div style="font-size:22px">${res.cabin}</div>
      <div>válido hasta ${(res.valid_until || '').slice(11, 16)}
      · entrada n.º ${res.entries}</div>
      <div class="small" style="opacity:.75">${(res.unlock && res.unlock.detail) || ''}</div>`;
    beep(true);
    if (navigator.vibrate) navigator.vibrate([80, 60, 80]);
  } else {
    ov.className = 'bad';
    ov.innerHTML = `<div style="font-size:30px">⛔ ACCESO DENEGADO</div>
      <div style="font-size:18px">${res.reason || res.error || 'error'}</div>`;
    beep(false);
    if (navigator.vibrate) navigator.vibrate(300);
  }
  ov.hidden = false;
}

async function handle(code) {
  if (cooldown || !CAB) return;
  const now = Date.now();
  if (code === lastCode && now - lastTs < 9000) return;
  lastCode = code; lastTs = now;
  cooldown = true;
  let res;
  try {
    const r = await fetch('/api/scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cab: CAB, k: K, code }),
    });
    res = await r.json();
  } catch (e) {
    res = { ok: false, reason: 'sin conexión con el servidor' };
  }
  showResult(res);
  refreshCabinState();
  setTimeout(() => {
    document.getElementById('overlay').hidden = true;
    cooldown = false;
  }, 4500);
}

/* ---------------- cámara ---------------- */
const startBtn = document.getElementById('start');
const videoEl = document.getElementById('video');
const cta = document.getElementById('cta');
const actions = document.getElementById('actions');
const torchBtn = document.getElementById('torch');
const hint = document.getElementById('hint');

async function refreshCabinState() {
  if (!CAB) return;
  try {
    const r = await fetch('/api/cabin_state?cab=' + CAB + '&k=' + encodeURIComponent(K));
    if (!r.ok) return;
    const d = await r.json();
    if (!d.ok) return;
    const occupied = d.state === 'ocupada';
    startBtn.classList.toggle('occupied', occupied);
    const wait = document.getElementById('cta-wait');
    wait.classList.toggle('occupied', occupied);
    wait.textContent = 'CABAÑA ' + CAB +
      (occupied ? ' · OCUPADA' : ' · ESPERANDO PASAJEROS') +
      (SECURE ? '' : ' · MODO FOTO');
    if (SECURE) {
      document.querySelector('#start .scan-big-text').innerHTML =
        occupied ? 'OCUPADO' : 'TOCA<br>PARA ESCANEAR';
      document.querySelector('#start .scan-big-sub').textContent =
        occupied ? 'Toca para escanear' : 'Presenta tu código QR';
    } else {
      document.querySelector('#start .scan-big-text').innerHTML =
        occupied ? 'OCUPADO' : 'TOMAR<br>FOTO';
      document.querySelector('#start .scan-big-sub').textContent =
        occupied ? 'Toca para tomar foto' : 'del código QR';
    }
  } catch (e) {}
}

async function setTorch(on) {
  if (!track) return false;
  try {
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (!caps.torch) return false;
    await track.applyConstraints({ advanced: [{ torch: on }] });
    return true;
  } catch (e) {
    return false;
  }
}

async function enableTorch() {
  if (await setTorch(true)) return true;
  await new Promise(r => setTimeout(r, 700));
  return await setTorch(true);
}

startBtn.onclick = async () => {
  if (!SECURE) { document.getElementById('photo').click(); return; }
  if (camOn) return;
  startBtn.disabled = true;
  try {
    video = videoEl;
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1280 }, height: { ideal: 720 }
      },
      audio: false
    });
    track = stream.getVideoTracks()[0] || null;
    video.srcObject = stream;
    await video.play();
    canvas = document.createElement('canvas');
    ctx = canvas.getContext('2d', { willReadFrequently: true });
    camOn = true;
    document.getElementById('err').hidden = true;
    cta.hidden = true;
    video.classList.add('on');
    actions.classList.add('on');
    hint.textContent = 'Cámara activa · enfoca el QR del ticket.';
    startBtn.disabled = false;
    requestAnimationFrame(tick);
    const lit = await enableTorch();
    if (lit) {
      torchBtn.hidden = false;
      torchBtn.dataset.on = '1';
      torchBtn.textContent = '💡 Luz encendida';
      hint.textContent = 'Luz encendida · enfoca el QR del ticket.';
    } else {
      torchBtn.hidden = true;
    }
  } catch (e) {
    startBtn.disabled = false;
    camOn = false;
    fatal('La cámara no está disponible (' + e.message + ').<br>' +
      'Puedes escribir el código del ticket abajo o usar un lector USB de QR.', false);
  }
};

torchBtn.onclick = async () => {
  const on = torchBtn.dataset.on !== '1';
  if (await setTorch(on)) {
    torchBtn.dataset.on = on ? '1' : '0';
    torchBtn.textContent = on ? '💡 Luz encendida' : '💡 Encender luz';
    hint.textContent = (on ? 'Luz encendida' : 'Luz apagada') +
      ' · enfoca el QR del ticket.';
  }
};

document.getElementById('stop').onclick = async () => {
  camOn = false;
  await setTorch(false);
  if (video && video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
    video.srcObject = null;
  }
  track = null;
  videoEl.classList.remove('on');
  actions.classList.remove('on');
  cta.hidden = false;
  torchBtn.hidden = true;
  startBtn.disabled = false;
  hint.textContent = 'Toca el botón verde para encender la cámara.';
};

function tick(ts) {
  if (!camOn) return;
  if (!cooldown && video.readyState === 4 && video.videoWidth &&
      ts - lastDecode > 220 && typeof jsQR !== 'undefined') {
    lastDecode = ts;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const qr = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
    if (qr && qr.data) handle(qr.data.trim());
  }
  requestAnimationFrame(tick);
}

/* ---------------- foto del QR (sin HTTPS) ---------------- */
document.getElementById('photo').addEventListener('change', async (ev) => {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const btn = document.getElementById('start');
  btn.disabled = true;
  let objectUrl = null;
  try {
    let src;
    if (window.createImageBitmap) {
      try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
      catch (e) { src = await createImageBitmap(file); }
    } else {
      src = await new Promise((res, rej) => {
        const im = new Image();
        im.onload = () => res(im);
        im.onerror = rej;
        im.src = objectUrl = URL.createObjectURL(file);
      });
    }
    const max = 1600;
    const sw = src.width || src.naturalWidth;
    const sh = src.height || src.naturalHeight;
    const scale = Math.min(1, max / Math.max(sw, sh));
    const w = Math.max(1, Math.round(sw * scale));
    const h = Math.max(1, Math.round(sh * scale));
    canvas = canvas || document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(src, 0, 0, w, h);
    if (src.close) src.close();
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    const img = ctx.getImageData(0, 0, w, h);
    const qr = (typeof jsQR !== 'undefined')
      ? jsQR(img.data, w, h, { inversionAttempts: 'attemptBoth' }) : null;
    if (qr && qr.data) {
      const code = qr.data.trim();
      document.getElementById('manual').value = code;
      handle(code);
    } else {
      showResult({ ok: false, reason: 'No pude leer el QR. Acércalo, enfócalo bien y vuelve a intentar.' });
      setTimeout(() => { document.getElementById('overlay').hidden = true; }, 3500);
    }
  } catch (e) {
    showResult({ ok: false, reason: 'No se pudo abrir la foto: ' + e.message });
    setTimeout(() => { document.getElementById('overlay').hidden = true; }, 3500);
  } finally {
    btn.disabled = false;
    ev.target.value = '';
  }
});

/* ---------------- manual ---------------- */
document.getElementById('send').onclick = () => {
  const v = document.getElementById('manual').value.trim();
  if (v) handle(v);
};
document.getElementById('manual').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('send').click();
});

refreshCabinState();
setInterval(refreshCabinState, 10000);
</script>
</body>
</html>
