; NodeMCU ESP8266 - cerradura de cabana / barrera
; Compilar:  pio run
; Flashear:  pio run -t upload
; Monitor:   pio device monitor
;
; IMPORTANTE: edita include/config.h antes de flashear.

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 460800
